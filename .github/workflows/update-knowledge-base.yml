name: Update Knowledge Base

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

permissions:
  contents: write

jobs:
  update-knowledge-base:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ingestion dependencies
        run: pip install -r requirements-ingestion.txt

      - name: Download PDFs from Google Drive
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: python src/ingestion/download_pdfs.py

      - name: Rebuild knowledge base
        run: python src/build_index.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- models/chunks.pkl models/college_index.faiss; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated knowledge base
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add models/chunks.pkl models/college_index.faiss
          git commit -m "Update knowledge base"
          git push
